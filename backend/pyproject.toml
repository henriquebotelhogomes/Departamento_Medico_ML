[project]
name = "radioai-backend"
version = "0.1.0"
description = "FastAPI backend for the RadioAI chest X-ray classifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2,<5",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "pillow>=11.0",
    "numpy<2.0",
    "tensorflow-cpu==2.21.0",
    "keras==3.15.0",
    "supabase>=2.10",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "pydicom>=2.4.4",
]

[project.optional-dependencies]
# Worker assíncrono + cache de predições (não instalado por padrão).
# Instale com: uv sync --extra worker  (ou: pip install -e ".[worker]")
worker = [
    "celery[redis]>=5.4",
    "redis>=5.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/File) as defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
