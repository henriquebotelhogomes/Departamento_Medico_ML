# Google Cloud Build configuration for RadioAI Serverless Deployment
# Builds the multi-stage Docker container and deploys to Cloud Run with Scale-to-Zero ($0 cost)

steps:
  # 1. Pull Git LFS model files
  - name: 'gcr.io/cloud-builders/git'
    args: ['lfs', 'pull']

  # 2. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/radioai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/radioai:latest'
      - '.'

  # 3. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/radioai:latest']

  # 4. Deploy to Cloud Run (Scale-to-Zero: min-instances 0)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'radioai'
      - '--image=gcr.io/$PROJECT_ID/radioai:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--timeout=60s'
      - '--port=8000'

images:
  - 'gcr.io/$PROJECT_ID/radioai:latest'
