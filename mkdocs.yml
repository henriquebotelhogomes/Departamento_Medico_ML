site_name: RadioAI — Chest X-ray Classification
site_description: Full-stack ML application for chest X-ray classification using ResNet50.
repo_url: https://github.com/OWNER/Departamento_Medico_ML
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Model Card: model-card.md
  - API: api.md
  - Setup: setup.md
  - Deploy: deploy.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
